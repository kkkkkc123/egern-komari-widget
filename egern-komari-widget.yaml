name: "Komari VPS Widget"
description: "在 Egern iOS 小组件中显示 Komari VPS 运行状态"
author: "kkkkkc123"
homepage: "https://github.com/kkkkkc123/egern-komari-widget"

# 安装模块后，请在模块的 Env 中设置：
# KOMARI_URL=https://status.example.com
# API_KEY=你的 Komari API Key（公开面板可以留空）

scriptings:
  - generic:
      name: "komari-widget"
      script_url: "https://raw.githubusercontent.com/kkkkkc123/egern-komari-widget/main/komari-widget.js"
      timeout: 20

widgets:
  - name: "Komari VPS"
    script_name: "komari-widget"
